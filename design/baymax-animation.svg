<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390"><style>
.mascot { isolation: isolate; }
.bay-float { animation: bay-float 5.6s cubic-bezier(.45,0,.55,1) infinite; }
.bay-squish { transform-origin: 150px 285px; animation: bay-breathe 5.6s ease-in-out infinite; }
.bay-head { transform-origin: 150px 145px; animation: bay-curious 9s ease-in-out infinite; }
.bay-face { transition: transform 650ms cubic-bezier(.22,1,.36,1); }
.mascot:hover .bay-face { transform: translateY(-2px); }
.bay-eyes { transform-origin: 150px 112px; animation: bay-blink 7.3s ease-in-out infinite; }
.bay-wave { transform-origin: 209px 222px; animation: bay-wave 8s cubic-bezier(.45,0,.55,1) infinite; }
.bay-arm-left { transform-origin: 86px 172px; animation: bay-arm 5.6s ease-in-out infinite; }
.bay-shadow { transform-origin: 150px 310px; animation: bay-shadow 5.6s ease-in-out infinite; }
.bay-heart { transform-origin: 181px 185px; animation: bay-heart 3.6s ease-in-out infinite; }
.bay-orbit { opacity: 0; transition: opacity 450ms ease; }
.app:has(.bay-response) .agent-header .bay-orbit { opacity: 1; }
.app:has(.bay-response) .agent-header .bay-head { animation: bay-attentive 2.4s ease-in-out infinite; }
.app:has(.bay-response) .agent-header .bay-wave { animation: none; transform: rotate(7deg); }
.bay-dot { transform-box: fill-box; transform-origin: center; animation: bay-dot 1.5s cubic-bezier(.45,0,.55,1) infinite; }
.bay-dot:nth-child(2) { animation-delay: -1.3s; }
.bay-dot:nth-child(3) { animation-delay: -1.1s; }
.bay-response { display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 24px; color: #738369; font-size: 10px; }
.bay-response-dots { display: inline-flex; align-items: center; gap: 4px; height: 18px; }
.bay-response-dots i { display: block; width: 5px; height: 5px; border-radius: 50%; background: #819b71; animation: bay-dot 1.5s cubic-bezier(.45,0,.55,1) infinite; }
.bay-response-dots i:nth-child(2) { animation-delay: -1.3s; }
.bay-response-dots i:nth-child(3) { animation-delay: -1.1s; }
.agent-header .small { width: 78px; height: 78px; margin-top: -6px; margin-bottom: -6px; }
@keyframes bay-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes bay-breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.025,.986); } }
@keyframes bay-curious { 0%,20%,60%,100% { transform: rotate(0); } 35%,45% { transform: rotate(-5deg); } 77%,85% { transform: rotate(3deg); } }
@keyframes bay-blink { 0%,39%,43%,70%,74%,100% { transform: scaleY(1); } 41%,72% { transform: scaleY(.10); } }
@keyframes bay-wave { 0%,12%,46%,100% { transform: rotate(4deg); } 21%,37% { transform: rotate(-13deg); } 29% { transform: rotate(11deg); } }
@keyframes bay-arm { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-5deg); } }
@keyframes bay-shadow { 0%,100% { transform: scaleX(1); opacity: .10; } 50% { transform: scaleX(.88); opacity: .065; } }
@keyframes bay-heart { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
@keyframes bay-attentive { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) translateY(-2px); } }
@keyframes bay-dot { 0%,100% { transform: translateY(0) scale(1); opacity: .45; } 50% { transform: translateY(-4px) scale(1.18,.88); opacity: 1; } }
@media (max-width: 760px) {
  .agent-header .small { width: 70px; height: 70px; margin-top: -4px; margin-bottom: -6px; }
}
@media (prefers-reduced-motion: reduce) {
  .mascot *, .bay-response-dots i { animation: none !important; transition: none !important; }
  .bay-dot, .bay-response-dots i { opacity: .8; }
}
